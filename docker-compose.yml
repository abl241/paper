# Local Postgres for backend integration tests.
#   docker compose up -d
#   npm test
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: paper
      POSTGRES_DB: paper_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper -d paper_test"]
      interval: 2s
      timeout: 3s
      retries: 15
